# strongSwan swanctl.conf â€” gateway-b (mirror of gateway-a)
# IKEv2 / ESP / tunnel / AES-256-CBC + HMAC-SHA256 / MODP3072 + PFS MODP2048 (fallback from GCM; see gateway-a)
# Must be identical proposals/PSK; only local/remote addrs and TS are swapped.

connections {
    site-to-site {
        version = 2
        local_addrs  = 10.77.0.20
        remote_addrs = 10.77.0.10
        proposals = aes256-sha256-modp3072
        encap = no
        dpd_delay = 30s
        dpd_timeout = 120s
        rekey_time = 3600s
        reauth_time = 0
        local {
            auth = psk
            id = gateway-b
        }
        remote {
            auth = psk
            id = gateway-a
        }
        children {
            net-v4v6 {
                local_ts  = 10.77.2.0/24,fd77:77:2::/64
                remote_ts = 10.77.1.0/24,fd77:77:1::/64
                esp_proposals = aes256-sha256-modp2048
                mode = tunnel
                start_action = start
                close_action = start
                dpd_action = restart
                rekey_time = 3600s
                life_time  = 3660s
            }
        }
    }
}

secrets {
    ike-psk {
        id-a = gateway-a
        id-b = gateway-b
        secret = "SihIpsecPsk2026-Phase1-Baseline!"
    }
}
