# strongSwan swanctl.conf â€” gateway-a
# IKEv2 / ESP / Tunnel mode / AES-256-CBC + HMAC-SHA256 / MODP3072 (DH group 15) + PFS MODP2048
# Transit: 10.77.0.10 <-> 10.77.0.20  (IPv4 IKE, protects both IPv4 and IPv6 subnets)
# Protected: 10.77.1.0/24 (fd77:77:1::/64) <-> 10.77.2.0/24 (fd77:77:2::/64)
# Installed version: strongSwan 5.9.8 (Debian bookworm) â€” swanctl/vici interface
# Notes:
#   - Preferred GCM (aes128gcm16-prfsha256-modp3072) is NOT available in Debian bookworm's
#     default strongSwan package (gcm/openssl/gcrypt plugins not shipped). Verified via
#     `ls /usr/lib/ipsec/plugins` â€” only aes, sha2, hmac, gmp etc. are present.
#     Attempting GCM yields "ENCRYPTION_ALGORITHM AES_GCM_16 not supported" + key derivation failed.
#     Therefore we use the strongest available CBC proposal: aes256-sha256-modp3072 (IKE)
#     and aes256-sha256-modp2048 (ESP with PFS group 14). This is still strong (256-bit, SHA256, DH3072).
#   - Future: if openssl/gcm plugins are built from source or added, switch back to
#     aes128gcm16-prfsha256-modp3072 / aes128gcm16-modp2048 (documented in baseline-s01.json history).
#   - local_ts/remote_ts define subnets to be tunneled; this yields tunnel mode (outer IP = transit addr).
#   - start_action=start to auto-initiate after load; dpd restart for liveness.
#   - Keep proposals identical on both gateways; single PSK for Phase-1 baseline.

connections {
    site-to-site {
        version = 2
        local_addrs  = 10.77.0.10
        remote_addrs = 10.77.0.20
        # IKEv2 proposals: encryption - integrity - prf - dh-group
        # aes256-sha256-modp3072 = AES-256-CBC + HMAC-SHA256 + PRF-HMAC-SHA256 + DH group 15
        proposals = aes256-sha256-modp3072
        encap = no
        dpd_delay = 30s
        dpd_timeout = 120s
        rekey_time = 3600s
        reauth_time = 0
        local {
            auth = psk
            id = gateway-a
        }
        remote {
            auth = psk
            id = gateway-b
        }
        children {
            net-v4v6 {
                # Tunnel CHILD SA: protects both IPv4 and IPv6 protected subnets over IPv4 IKE
                local_ts  = 10.77.1.0/24,fd77:77:1::/64
                remote_ts = 10.77.2.0/24,fd77:77:2::/64
                esp_proposals = aes256-sha256-modp2048
                mode = tunnel
                start_action = start
                close_action = start
                dpd_action = restart
                rekey_time = 3600s
                life_time  = 3660s
            }
        }
    }
}

secrets {
    ike-psk {
        id-a = gateway-a
        id-b = gateway-b
        secret = "SihIpsecPsk2026-Phase1-Baseline!"
    }
}
