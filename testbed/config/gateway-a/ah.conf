# AH tunnel - proves AH protocol via XFRM proto ah, distinct IKE proposal aes192-sha256-modp2048
connections {
    ah-test {
        version = 2
        local_addrs  = 10.77.0.10
        remote_addrs = 10.77.0.20
        proposals = aes192-sha256-modp2048
        local {
            auth = psk
            id = gateway-a
        }
        remote {
            auth = psk
            id = gateway-b
        }
        children {
            ah-child {
                local_ts = 10.77.8.0/24
                remote_ts = 10.77.9.0/24
                ah_proposals = sha256
                mode = tunnel
                start_action = none
            }
        }
    }
}
