# Transport mode - host-to-host between gateway transit IPs
# Proves mode transport via XFRM, distinct proposal aes128-sha256-modp2048
connections {
    transport {
        version = 2
        local_addrs  = 10.77.0.10
        remote_addrs = 10.77.0.20
        proposals = aes128-sha256-modp3072
        local {
            auth = psk
            id = gateway-a
        }
        remote {
            auth = psk
            id = gateway-b
        }
        children {
            host-host {
                local_ts = 10.77.0.10/32
                remote_ts = 10.77.0.20/32
                esp_proposals = aes128-sha256-modp2048
                mode = transport
                start_action = none
            }
        }
    }
}

