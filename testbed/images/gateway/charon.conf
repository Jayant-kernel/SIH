# strongSwan charon logging override
# This file is included via strongswan.conf -> strongswan.d/*.conf
# Do NOT include plugins/charon/*.conf here — that is already done in strongswan.conf.
# We only override logging to stderr for docker logs.

charon {
    filelog {
        stderr {
            time_format = %Y-%m-%dT%H:%M:%S
            ike_name = yes
            default = 1
            ike = 2
            knl = 2
            cfg = 2
            net = 2
            esp = 2
            chd = 1
        }
    }
}
